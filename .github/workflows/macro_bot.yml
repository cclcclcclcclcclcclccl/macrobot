name: 總經早報

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 00:00 = 台灣時間 08:00
  workflow_dispatch:       # 手動觸發測試用

jobs:
  send_report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: 安裝 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install requests python-dotenv yfinance

      - name: 執行腳本
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python macro_bot.py
